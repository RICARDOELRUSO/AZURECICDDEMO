# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: 'CICDDemo'
  agent: 'CP-ricar-BQR6U'
steps:

- task: UiPathTest@6
  inputs:
    testTarget: 'TestProject'
    orchestratorConnection: 'CICDDemoConnection'
    testProjectPath: 'project.json'
    folderName: 'AZURECICDTESTING'
    testReportDestination: 'result.json'
    traceLevel: 'Information'
